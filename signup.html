<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orizon Sign-up</title>
<meta name="description" content="Enter your WhatsApp number and Orizon will text you to get started.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310756e'/%3E%3Ctext x='50' y='70' font-family='monospace' font-size='60' font-weight='700' fill='%23fff' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<style>
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; font-display: swap; src: url(/fonts/JetBrainsMono-400.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; font-display: swap; src: url(/fonts/JetBrainsMono-500.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; font-display: swap; src: url(/fonts/JetBrainsMono-700.woff2) format('woff2'); }
  :root {
    color-scheme: light;
    --ink: #262019;
    --lead: #3a342a;
    --muted: #6f6857;
    --line-strong: #d8d2c2;
    --green: #10756e;
    --green-dark: #0d6b64;
    --paper: #f5f3ec;
    --card: #fffdf8;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased; padding-inline: 24px; padding-block: 0 56px; }
  .bar, .hero { max-width: 640px; margin: 0 auto; }
  .bar { padding-block: 20px; }
  .brand { font: 700 19px var(--mono); letter-spacing: -.01em; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 9px; }
  .mark { width: 22px; height: 22px; background: var(--green); color: #fff; font-size: 14px; line-height: 22px; text-align: center; }
  .hero { padding-top: clamp(40px, 12vh, 120px); }
  h1 { font: 400 clamp(30px, 5.4vw, 46px)/1.12 var(--mono); letter-spacing: -.02em; margin: 0 0 22px; text-wrap: balance; }
  .lead { font-size: clamp(18px, 2.2vw, 20px); line-height: 1.55; color: var(--lead); margin: 0; max-width: 52ch; }
  .field { margin-top: 30px; display: grid; gap: 10px; max-width: 400px; }
  input { width: 100%; font: 400 16px var(--mono); padding: 12px 16px; border-radius: 0;
    border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); }
  input::placeholder { color: var(--muted); }
  input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .btn { text-align: center; background: var(--green); color: #fff; font: 500 15px var(--mono); letter-spacing: .01em; text-decoration: none;
    padding: 12px 22px; border: 1px solid var(--green); border-radius: 0; transition: background .15s ease, border-color .15s ease, opacity .15s ease; }
  .btn:hover { background: var(--green-dark); border-color: var(--green-dark); }
  .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
  .btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  button.btn { cursor: pointer; }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .status { margin: 4px 0 0; font-size: 16px; color: var(--lead); min-height: 1.6em; }
  .status.bad { color: #a3341f; }
  a { color: var(--green); }
  .consent { margin: 0; font-size: 14px; color: var(--muted); }
  footer { max-width: 640px; margin: 72px auto 0; padding-top: 22px; border-top: 1px solid var(--line-strong); font: 13px var(--mono); color: var(--muted); text-align: center; }
</style>
</head>
<body>

<div class="bar">
  <a class="brand" href="/"><span class="mark">O</span>Orizon</a>
</div>

<div class="hero">
  <h1>The assistant that texts you first.</h1>
  <p class="lead">Enter your number and it will text you to get started.</p>
  <form class="field" id="signup">
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+44 7700 900123" aria-label="WhatsApp number with country code" autofocus>
    <button id="go" class="btn" type="submit" disabled>Text me</button>
    <p class="consent">By tapping Text me, you agree that Orizon can message you on WhatsApp. See our <a href="/privacy">privacy policy</a>.</p>
    <p id="status" class="status" role="status"></p>
  </form>
</div>

<footer>
  © 2026 Orizon · <a href="/privacy">Privacy</a>
</footer>

<script>
  // go.orizon.fun answers with one outcome word; every message people read lives here, so changing one is a website push.
  const MESSAGES = {
    sent: "Orizon just texted you. Open WhatsApp to sign in.",
    template: "Orizon just texted you. Reply to its message on WhatsApp to get started.",
    recent: "Orizon texted you a minute ago. Check WhatsApp.",
    waitlisted: "You're on the waitlist. We'll be in touch.",
    invalid: "That isn't a phone number. Include the country code.",
    refused: "WhatsApp refused the message. Check the number and try again.",
  };
  const RETRY = "Something went wrong on our side. Try again in a minute.";
  const GOOD = ["sent", "template", "recent", "waitlisted"];
  const form = document.getElementById("signup");
  const phone = document.getElementById("phone");
  const go = document.getElementById("go");
  const status = document.getElementById("status");
  const digits = () => phone.value.replace(/\D/g, "");
  phone.addEventListener("input", () => {
    go.disabled = digits().length < 8 || digits().length > 15;
  });
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    go.disabled = true;
    status.className = "status";
    status.textContent = "Sending…";
    const outcome = await fetch("https://go.orizon.fun/provision?phone=" + digits())
      .then((response) => response.text())
      .catch(() => "");
    status.textContent = MESSAGES[outcome] || RETRY;
    status.classList.toggle("bad", !GOOD.includes(outcome));
    go.disabled = false;
  });
</script>

</body>
</html>
